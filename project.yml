name: Nitecast
options:
  bundleIdPrefix: app.nitecast
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
packages:
  GoogleCast:
    url: https://github.com/googlecast/google-cast-ios-sdk
    exactVersion: 4.8.6
targets:
  Nitecast:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleCast
        product: GoogleCastDynamic
    sources:
      - path: Nitecast
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nitecast.companion
        PRODUCT_NAME: Nitecast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Nitecast/Info.plist
      properties:
        CFBundleDisplayName: Nitecast
        CFBundleShortVersionString: "1.2.0"
        CFBundleVersion: "5"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing QR code displayed by Nitecast on your PC.
        NSLocalNetworkUsageDescription: Connect to your Nitecast PC to browse your library and control TV playback.
        NSBonjourServices:
          - _googlecast._tcp
          - _CC1AD845._googlecast._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NitecastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NitecastTests
    dependencies:
      - target: Nitecast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.nitecast.companion.tests
schemes:
  Nitecast:
    build:
      targets:
        Nitecast: all
        NitecastTests: [test]
    test:
      targets:
        - NitecastTests
