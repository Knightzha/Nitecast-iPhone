name: Nitecast
options:
  bundleIdPrefix: app.nitecast
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGNING_ALLOWED: NO
targets:
  Nitecast:
    type: application
    platform: iOS
    sources:
      - path: Nitecast
        excludes:
          - Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.nitecast.companion
        PRODUCT_NAME: Nitecast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: Nitecast/Info.plist
      properties:
        CFBundleDisplayName: Nitecast
        CFBundleShortVersionString: "1.0.2"
        CFBundleVersion: "3"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: Scan the pairing QR code displayed by Nitecast on your PC.
        NSLocalNetworkUsageDescription: Connect to your Nitecast PC to browse your library and control TV playback.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
  NitecastTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NitecastTests
    dependencies:
      - target: Nitecast
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.nitecast.companion.tests
schemes:
  Nitecast:
    build:
      targets:
        Nitecast: all
        NitecastTests: [test]
    test:
      targets:
        - NitecastTests
